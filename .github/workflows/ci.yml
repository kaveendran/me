name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (adds windows-curses on Windows)
        run: python -m pip install --quiet -e .
      - name: Unit tests
        run: python -X utf8 -W error::ResourceWarning -m unittest discover -s tests -t .

  install-unix:
    name: installer (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      ME_REPO: ${{ github.workspace }}   # clone this commit, the way a new user clones GitHub
      ME_DIR: ${{ runner.temp }}/me_harness
    steps:
      - uses: actions/checkout@v4
      - name: Lint the installer
        if: runner.os == 'Linux'
        run: shellcheck -s bash install.sh
      - name: Start a systemd user session
        if: runner.os == 'Linux'
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 40); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 0.5; done
      - name: Install, piped like curl | bash
        run: bash -s -- --yes --no-setup --no-obsidian --ui < install.sh
      - name: Use it
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          me --help > /dev/null
          me init
          me note "café ☕ and a 🎯 focus block"
          grep -rq "🎯" "$HOME/Documents/me/vault/Inbox"
          test -f "$ME_DIR/ui/dist/index.html"
          me schedule install
          me schedule status
          if me schedule status | grep "not installed"; then exit 1; fi
          sleep 5 && curl -fsS -o /dev/null http://127.0.0.1:4777/   # Mission Control, started by the scheduler
          me schedule uninstall
          if me schedule status | grep -v "not installed"; then exit 1; fi
      - name: gh and Node.js downloads verify their checksums
        run: |
          set -e
          export HOME="$RUNNER_TEMP/fresh-home" && mkdir -p "$HOME"
          export PATH="$HOME/.local/bin:$PATH"
          . ./install.sh --yes
          # The runner has its own gh and node: count only ours, in the fresh home.
          have() { case "$1" in gh|node|npm) [ -x "$BIN/$1" ] ;; *) command -v "$1" >/dev/null 2>&1 ;; esac; }
          install_gh && "$BIN/gh" --version
          install_node && node --version && npm --version
      - name: Run it again (updates in place)
        run: bash -s -- --yes --no-setup --no-obsidian --no-ui < install.sh
      - name: Uninstall
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          bash install.sh --uninstall
          if [ -e "$HOME/.local/bin/me" ]; then echo "me is still installed"; exit 1; fi

  install-windows:
    name: installer (windows-latest)
    runs-on: windows-latest
    env:
      ME_REPO: ${{ github.workspace }}
      ME_DIR: ${{ runner.temp }}\me_harness
    steps:
      - uses: actions/checkout@v4
      - name: Install, piped like irm | iex (Windows PowerShell 5.1)
        shell: powershell
        run: '& ([scriptblock]::Create((Get-Content -Raw install.ps1))) -Yes -NoSetup -NoObsidian -Ui'
      - name: Use it
        shell: pwsh
        run: |
          $env:Path = "$HOME\.local\bin;$env:Path"
          function Check { if ($LASTEXITCODE) { throw "exit code $LASTEXITCODE" } }
          me --help | Out-Null; Check
          me init; Check
          me note "café ☕ and a 🎯 focus block"; Check
          if (-not (Select-String -Path "$HOME\Documents\me\vault\Inbox\*.md" -Pattern "🎯" -Encoding utf8 -Quiet)) { throw "note not saved as UTF-8" }
          if (-not (Test-Path "$env:ME_DIR\ui\dist\index.html")) { throw "web UI not built" }
          $python = Join-Path (uv tool dir) "me-harness\Scripts\python.exe"
          & $python -c "import curses, harness.tui; print('terminal UI imports')"; Check
          me schedule install; Check
          me schedule status; Check
          if (me schedule status | Select-String "not installed") { throw "a job didn't install" }
          Start-Sleep 10
          Invoke-WebRequest http://127.0.0.1:4777/ -UseBasicParsing | Out-Null   # Mission Control, from a windowless task
          me schedule uninstall; Check
      - name: gh and Node.js downloads verify their checksums
        shell: powershell
        run: |
          $env:LOCALAPPDATA = "$env:RUNNER_TEMP\fresh-appdata"
          $env:Path = ($env:Path -split ';' | Where-Object { $_ -notmatch 'GitHub CLI|nodejs' }) -join ';'
          . .\install.ps1 -Yes
          $Bin = "$env:RUNNER_TEMP\fresh-bin"
          Install-Gh
          & "$Bin\gh.exe" --version
          if (-not (Install-Node)) { throw "Node.js didn't install" }
          node --version
      - name: Run it again (updates in place)
        shell: powershell
        run: '& ([scriptblock]::Create((Get-Content -Raw install.ps1))) -Yes -NoSetup -NoObsidian -NoUi'
      - name: Uninstall
        shell: powershell
        run: |
          .\install.ps1 -Uninstall
          if (Test-Path "$HOME\.local\bin\me.exe") { throw "me is still installed" }
