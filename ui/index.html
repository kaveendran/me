<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--ME_TOKEN-->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0e16" />
    <meta name="description" content="me · Mission Control: your day, approvals, work, agents, wellbeing and memory." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>me · Mission Control</title>
    <script>
      // Replay the last applied theme palette before first paint (src/theme.tsx keeps it fresh).
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem("me-theme-cache") || "null");
          if (!c || c.v !== 1 || !c.palette) return;
          var mode = c.mode === "dark" || c.mode === "light" ? c.mode
            : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          var p = c.palette[mode];
          if (!p) return;
          var r = document.documentElement;
          for (var k in p) if (/^[a-z0-9-]{1,40}$/.test(k) && typeof p[k] === "string") r.style.setProperty("--" + k, p[k]);
          r.setAttribute("data-mode", mode);
          r.setAttribute("data-state", c.state || "steady");
          r.setAttribute("data-calm", c.calm ? "true" : "false");
          r.style.colorScheme = mode;
          var m = document.querySelector('meta[name="theme-color"]');
          if (m && p.bg) m.setAttribute("content", p.bg);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
