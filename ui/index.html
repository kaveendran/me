<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--ME_TOKEN-->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0a0e16" />
    <meta name="description" content="me · Mission Control: your day, approvals, work, agents, wellbeing and memory." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>me · Mission Control</title>
    <script>
      // Apply a saved manual theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("me-theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
